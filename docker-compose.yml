version: '3.8'

services:
  service-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-hub-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PASSWORD=admin
      # JWT_SECRET: Thay đổi thành chuỗi bí mật tối thiểu 32 ký tự khi chạy thực tế (openssl rand -base64 32)
      - JWT_SECRET=service-hub-jwt-secret-key-32chars
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      # Persistent storage for service cards and portal configurations
      - ./data:/app/data
      # Mount host Docker socket:
      # - Dùng :ro (Read-Only) để giám sát và tự động khám phá container (khuyến nghị bảo mật)
      # - Đổi sang :rw nếu bạn muốn sử dụng tính năng 'Restart Container' trực tiếp từ giao diện
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/services"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portal-net

networks:
  portal-net:
    driver: bridge
