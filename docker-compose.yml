version: '3.8'

services:
  service-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-hub-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PASSWORD=admin
      - JWT_SECRET=change-this-to-a-secure-secret-string-in-production
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      # Persistent storage for service cards and portal configurations
      - ./data:/app/data
      # Mount host Docker socket in read-only mode to auto-discover local containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/services"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portal-net

networks:
  portal-net:
    driver: bridge
